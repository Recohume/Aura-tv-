
name: Build IDLIX Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          results=("${PIPESTATUS[@]}")
          set -e

          SDK_STATUS="${results[1]}"

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "ERROR: Android SDK license acceptance failed."
            exit "$SDK_STATUS"
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Remove local Java path override
        shell: bash
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/^org.gradle.java.home=/d' gradle.properties
          fi

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build mobile debug APK
        run: ./gradlew --no-daemon :app-mobile:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDLIX-Mobile-Debug
          path: app-mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  
